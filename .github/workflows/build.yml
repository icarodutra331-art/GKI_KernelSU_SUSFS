name: Build GKI S24U Spoof Final
permissions:
  contents: write
  actions: write 

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Versão do Android"
        required: true
        default: "android15"
      kernel_version:
        description: "Versão do Kernel"
        required: true
        default: "6.6"
      os_patch_level:
        description: "Patch Level"
        required: true
        default: "2024-11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lld llvm clang git python3 curl wget
          mkdir -p bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > bin/repo
          chmod a+rx bin/repo
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Sync Kernel Source
        run: |
          mkdir kernel && cd kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}
          repo sync -c -j$(nproc --all) --no-tags --fail-fast

      - name: Integrate KernelSU Next (Sem Erro de Pasta)
        run: |
          # Aqui está o truque: usamos o 'find' para achar a pasta drivers não importa onde ela esteja
          COMMON_PATH=$(find kernel -name "drivers" -type d -print -quit | sed 's/\/drivers//')
          cd $COMMON_PATH
          
          git clone https://github.com/rifsxd/KernelSU-Next.git
          cp -r KernelSU-Next/kernel drivers/kernelsu
          
          echo "obj-y += kernelsu/" >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo "KernelSU Next integrado com sucesso."

      - name: Integrate SUSFS & Samsung Spoof
        run: |
          # Localiza o diretório common novamente
          COMMON_PATH=$(find kernel -name "drivers" -type d -print -quit | sed 's/\/drivers//')
          cd $COMMON_PATH
          
          git clone https://github.com/TheWildJames/GKI_KernelSU_SUSFS.git
          
          # Procura os arquivos .h e .c do SUSFS para evitar o erro "No such file"
          find GKI_KernelSU_SUSFS -name "susfs.h" -exec cp {} include/linux/ \;
          find GKI_KernelSU_SUSFS -name "susfs.c" -exec cp {} fs/ \;
          
          # Aplica o patch de ocultação se existir
          [ -f GKI_KernelSU_SUSFS/hide.patch ] && patch -p1 < GKI_KernelSU_SUSFS/hide.patch

      - name: Configurar Spoofing S24 Ultra (SM-S928B)
        run: |
          COMMON_PATH=$(find kernel -name "gki_defconfig" -print -quit | sed 's/\/arch\/arm64\/configs\/gki_defconfig//')
          DEFCONFIG="$COMMON_PATH/arch/arm64/configs/gki_defconfig"
          
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_NEXT=y"
            echo "CONFIG_SUSFS=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_SAMSUNG=y"
            echo 'CONFIG_KSU_SUSFS_SPOOF_MODEL="SM-S928B"'
            echo 'CONFIG_KSU_SUSFS_SPOOF_PRODUCT="e3q"'
            echo 'CONFIG_KSU_SUSFS_SPOOF_MANUFACTURER="samsung"'
            echo 'CONFIG_KSU_SUSFS_SPOOF_DEVICE="e3q"'
          } >> $DEFCONFIG

      - name: Force Version 6.6.98 & Build
        run: |
          COMMON_PATH=$(find kernel -name "Makefile" -type f -exec grep -l "SUBLEVEL =" {} + | head -n 1 | sed 's/\/Makefile//')
          cd $COMMON_PATH
          sed -i 's/^VERSION =.*/VERSION = 6/' Makefile
          sed -i 's/^PATCHLEVEL =.*/PATCHLEVEL = 6/' Makefile
          sed -i 's/^SUBLEVEL =.*/SUBLEVEL = 98/' Makefile
          
          cd ../..
          # Remove o check_defconfig para não dar erro nas flags de Samsung
          find kernel -name "build.config.gki" -exec sed -i 's/check_defconfig//' {} +
          
          tools/bazel build --config=fast //common:kernel_aarch64_dist

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S24U-Spoof-Final
          path: kernel/bazel-bin/common/kernel_aarch64/Image
