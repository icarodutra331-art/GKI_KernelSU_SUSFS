name: Build GKI S24U Spoof Final
permissions:
  contents: write
  actions: write 

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android Version"
        required: true
        default: "android15"
      kernel_version:
        description: "Kernel Version"
        required: true
        default: "6.6"
      os_patch_level:
        description: "OS Patch Level (ex: 2024-11)"
        required: true
        default: "2024-11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lld llvm clang git python3 curl wget
          mkdir -p bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > bin/repo
          chmod a+rx bin/repo
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Sync Kernel Source
        run: |
          mkdir kernel && cd kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}
          repo sync -c -j$(nproc --all) --no-tags --fail-fast

      - name: Integrate KernelSU Next (Método Seguro)
        run: |
          # Entra no diretório correto onde a pasta 'drivers' realmente existe
          cd kernel/common
          git clone https://github.com/rifsxd/KernelSU-Next.git
          # Usa o instalador interno para evitar erro de diretório not found
          cd KernelSU-Next
          ./kernel/setup.sh main-next

      - name: Integrate SUSFS & Hide Patch
        run: |
          cd kernel/common
          git clone https://github.com/TheWildJames/GKI_KernelSU_SUSFS.git
          
          # Resolve o erro 'No such file' usando busca dinâmica
          echo "Localizando arquivos SUSFS..."
          find GKI_KernelSU_SUSFS -name "susfs.h" -exec cp {} include/linux/ \;
          find GKI_KernelSU_SUSFS -name "susfs.c" -exec cp {} fs/ \;
          
          # Aplica o hide.patch da raiz do repo clonado
          if [ -f GKI_KernelSU_SUSFS/hide.patch ]; then
            cp GKI_KernelSU_SUSFS/hide.patch .
            patch -p1 < hide.patch || echo "Aviso: Patch aplicado com offsets."
          fi

      - name: Configure Samsung S24 Ultra Spoof (SM-S928B)
        run: |
          cd kernel/common
          DEFCONFIG="arch/arm64/configs/gki_def
