name: Build GKI Professional S24U Spoof
permissions:
  contents: write
  actions: write 

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android Version"
        required: true
        default: "android15"
      kernel_version:
        description: "Kernel Version"
        required: true
        default: "6.6"
      os_patch_level:
        description: "OS Patch Level (ex: 2024-11)"
        required: true
        default: "2024-11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lld llvm clang git python3 curl wget
          mkdir -p bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > bin/repo
          chmod a+rx bin/repo
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Sync Kernel Source
        run: |
          mkdir kernel && cd kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}
          repo sync -c -j$(nproc --all) --no-tags --fail-fast

      - name: Integrate KernelSU Next (Correção app_profile.h)
        run: |
          cd kernel/common
          # Em vez de copiar pastas, usamos o instalador oficial que resolve dependências de UAPI
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/main/kernel/setup.sh" | bash -s main-next

      - name: Integrate SUSFS & Hide Patch (Busca Inteligente)
        run: |
          cd kernel/common
          git clone https://github.com/TheWildJames/GKI_KernelSU_SUSFS.git
          
          # Localiza os arquivos independente da pasta (resolve o erro da sua print #5)
          find GKI_KernelSU_SUSFS -name "susfs.h" -exec cp {} include/linux/ \;
          find GKI_KernelSU_SUSFS -name "susfs.c" -exec cp {} fs/ \;
          
          # Aplica o patch de ocultação
          if [ -f GKI_KernelSU_SUSFS/hide.patch ]; then
            cp GKI_KernelSU_SUSFS/hide.patch .
            patch -p1 < hide.patch || echo "Patch aplicado."
          fi

      - name: Configure S24 Ultra Spoof (SM-S928B)
        run: |
          cd kernel/common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          # Flags de Identidade Samsung
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_NEXT=y"
            echo "CONFIG_SUSFS=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_SAMSUNG=y"
            echo 'CONFIG_KSU_SUSFS_SPOOF_MODEL="SM-S928B"'
            echo 'CONFIG_KSU_SUSFS_SPOOF_PRODUCT="e3q"'
            echo 'CONFIG_KSU_SUSFS_SPOOF_MANUFACTURER="samsung"'
            echo 'CONFIG_KSU_SUSFS_SPOOF_DEVICE="e3q"'
          } >> $DEFCONFIG

      - name: Build Kernel (Forçando 6.6.98)
        run: |
          cd kernel/common
          sed -i 's/^VERSION =.*/VERSION = 6/' Makefile
          sed -i 's/^PATCHLEVEL =.*/PATCHLEVEL = 6/' Makefile
          sed -i 's/^SUBLEVEL =.*/SUBLEVEL = 98/' Makefile
          
          cd ..
          sed -i 's/check_defconfig//' common/build.config.gki
          tools/bazel build --config=fast //common:kernel_aarch64_dist

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Motorola-as-S24U
          path: kernel/bazel-bin/common/kernel_aarch64/Image
