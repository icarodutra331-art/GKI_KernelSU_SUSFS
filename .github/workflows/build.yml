name: Build GKI S24U Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Kernel
        # Chamando a action direto da fonte para evitar erro de 'action.yml'
        uses: TheWildJames/GKI_KernelSU_SUSFS@main
        with:
          kernel_source: https://android.googlesource.com/kernel/common
          kernel_branch: android15-6.6
          kernel_config: gki_defconfig
          arch: arm64
          clang_version: r522138b
          
          # Personalização do seu S24 Ultra
          extra_build_commands: CONFIG_LOCALVERSION=-Samsung-S24-Ultra
          
          # Configurações de Root e Ocultação
          enable_kernelsu: true
          kernelsu_variant: next
          enable_susfs: true
          susfs_version: v2.1.0
          
          # Garante que o build não pare por avisos bobos
          disable_werror: true
