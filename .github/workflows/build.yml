name: Build GKI S24U Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Tools
        run: git clone https://github.com/TheWildJames/GKI_KernelSU_SUSFS.git builder

      - name: Build Kernel
        run: |
          cd builder
          
          # Find the exact script path regardless of hidden folders
          SCRIPT_PATH=$(find . -name "build-kernel.sh" | head -n 1)
          
          if [ -z "$SCRIPT_PATH" ]; then
            echo "ERROR: build-kernel.sh not found!"
            find . -maxdepth 4 -name "*.sh"
            exit 1
          fi
          
          chmod +x "$SCRIPT_PATH"
          
          # Setup Environment Variables
          export INPUT_KERNEL_SOURCE="https://android.googlesource.com/kernel/common"
          export INPUT_KERNEL_BRANCH="android15-6.6"
          export INPUT_KERNEL_CONFIG="gki_defconfig"
          export INPUT_ARCH="arm64"
          export INPUT_CLANG_VERSION="r522138b"
          export INPUT_EXTRA_BUILD_COMMANDS="CONFIG_LOCALVERSION=-Samsung-S24-Ultra"
          export INPUT_ENABLE_KERNELSU="true"
          export INPUT_KERNELSU_VARIANT="next"
          export INPUT_ENABLE_SUSFS="true"
          export INPUT_SUSFS_VERSION="v2.1.0"
          export INPUT_DISABLE_WERROR="true"
          export INPUT_MAKE_ANYKERNEL3="true"
          export GITHUB_WORKSPACE=$(pwd)

          echo "Running script from: $SCRIPT_PATH"
          bash "$SCRIPT_PATH"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S24U-Next-SUSFS
          path: |
            builder/out/*
            builder/**/*.img
            builder/*.zip
