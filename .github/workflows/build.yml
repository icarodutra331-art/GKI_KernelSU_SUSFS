name: Build GKI S24U Professional
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lld llvm clang git python3 curl wget libssl-dev

      - name: Setup Kernel Source (GKI 6.6)
        run: |
          git clone --depth 1 -b android15-6.6 https://android.googlesource.com/kernel/common kernel_source

      - name: Integrate KernelSU Next
        run: |
          cd kernel_source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Integrate SUSFS & Hide Patches
        run: |
          # 1. Clonar repositório de ferramentas (WildJames)
          git clone https://github.com/TheWildJames/GKI_KernelSU_SUSFS.git susfs_src
          
          # 2. Localizar arquivos essenciais dinamicamente
          SUSFS_H=$(find susfs_src -name "susfs.h")
          SUSFS_C=$(find susfs_src -name "susfs.c")
          HIDE_PATCH=$(find susfs_src -name "hide.patch")
          KSU_PATCH=$(find susfs_src -name "10_enable_susfs_for_ksu.patch")
          GKI_PATCH=$(find susfs_src -name "50_add_susfs_in_gki-android15-6.6.patch")

          # 3. Copiar arquivos para o kernel_source
          cp "$SUSFS_H" kernel_source/include/linux/
          cp "$SUSFS_C" kernel_source/fs/
          cp "$HIDE_PATCH" kernel_source/
          cp "$KSU_PATCH" kernel_source/
          cp "$GKI_PATCH" kernel_source/

          # 4. Aplicar os patches
          cd kernel_source
          patch -p1 < 10_enable_susfs_for_ksu.patch
          patch -p1 < 50_add_susfs_in_gki-android15-6.6.patch
          patch -p1 < hide.patch || echo "Hide patch applied with warnings"

      - name: Build Kernel (The Success Config)
        run: |
          cd kernel_source
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out gki_defconfig
          
          # Ativando as flags de camuflagem das suas fotos
          echo "CONFIG_SUSFS=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> out/.config
          
          make -j$(nproc --all) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CONFIG_LOCALVERSION="-Samsung-S24-Ultra-SUSFS"

      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GKI-6.6-S24U-KSU-SUSFS-HIDDEN
          path: kernel_source/out/arch/arm64/boot/Image
