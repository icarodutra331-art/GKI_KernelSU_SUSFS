- name: Execution Step
      run: |
        # 1. Identify the cloned directory name
        ls -d */
        
        # 2. Search for the build script using absolute path
        REAL_SCRIPT=$(find $(pwd) -name "build-kernel.sh" | head -n 1)
        
        if [ -z "$REAL_SCRIPT" ]; then
          echo "❌ Error: build-kernel.sh not found!"
          echo "Listing available files for debugging:"
          find . -maxdepth 3 -not -path '*/.*'
          exit 1
        fi
        
        echo "✅ Script found at: $REAL_SCRIPT"
        chmod +x "$REAL_SCRIPT"
        
        # 3. Set the builder root directory
        # This ensures the script runs from the correct base folder
        BUILDER_ROOT=$(dirname $(dirname $(dirname "$REAL_SCRIPT")))
        cd "$BUILDER_ROOT"
        
        # 🔥 Mandatory Environment Variables (GitHub Action Emulation)
        export INPUT_KERNEL_SOURCE="https://android.googlesource.com/kernel/common"
        export INPUT_KERNEL_BRANCH="android15-6.6"
        export INPUT_KERNEL_CONFIG="gki_defconfig"
        export INPUT_ARCH="arm64"
        export INPUT_CLANG_VERSION="r522138b"
        export INPUT_EXTRA_BUILD_COMMANDS="CONFIG_LOCALVERSION=-Samsung-S24-Ultra"
        export INPUT_ENABLE_KERNELSU="true"
        export INPUT_KERNELSU_VARIANT="next"
        export INPUT_ENABLE_SUSFS="true"
        export INPUT_SUSFS_VERSION="v2.1.0"
        export INPUT_DISABLE_WERROR="true"
        export INPUT_MAKE_ANYKERNEL3="true"
        
        # Required Workspace Variable
        export GITHUB_WORKSPACE=$(pwd)

        echo "🚀 Starting build process..."
        bash "$REAL_SCRIPT"
