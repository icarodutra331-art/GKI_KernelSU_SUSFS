name: Build GKI S24U Professional
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lld llvm clang git python3 curl wget libssl-dev

      - name: Setup Kernel Source (GKI 6.6)
        run: |
          # Cloning only the necessary to avoid timeout
          git clone --depth 1 -b android15-6.6 https://android.googlesource.com/kernel/common kernel_source

      - name: Integrate KernelSU Next
        run: |
          cd kernel_source
          # Official KernelSU Next integration
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Build Kernel (Using Native Clang)
        run: |
          cd kernel_source
          
          # We use the system's LLVM/Clang which is stable
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out gki_defconfig
          
          echo "Starting compilation... This will take a while."
          make -j$(nproc --all) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CONFIG_LOCALVERSION="-Samsung-S24-Ultra"

      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GKI-6.6-S24U-KernelSU
          path: kernel_source/out/arch/arm64/boot/Image
