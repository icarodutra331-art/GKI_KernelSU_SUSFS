name: Build GKI Moto Puro Final
permissions:
  contents: write
  actions: write 

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android Version"
        required: true
        default: "android15" # Mantemos android15 pois é a base GKI estável para o kernel 6.6
      kernel_version:
        description: "Kernel Version"
        required: true
        default: "6.6"
      os_patch_level:
        description: "OS Patch Level (Ex: 2024-11)"
        required: true
        default: "2024-11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lld llvm clang git python3 curl wget
          mkdir -p bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > bin/repo
          chmod a+rx bin/repo
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Sync Kernel Source
        run: |
          mkdir kernel && cd kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}
          repo sync -c -j$(nproc --all) --no-tags --fail-fast

      - name: Integrate KernelSU Next
        run: |
          COMMON_DIR=$(find kernel -name "drivers" -type d -print -quit | sed 's/\/drivers//')
          cd $COMMON_DIR
          git clone https://github.com/rifsxd/KernelSU-Next.git
          cp -r KernelSU-Next/kernel drivers/kernelsu
          echo "obj-y += kernelsu/" >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Integrate SUSFS (Sem Spoof Samsung)
        run: |
          COMMON_DIR=$(find kernel -name "drivers" -type d -print -quit | sed 's/\/drivers//')
          cd $COMMON_DIR
          git clone https://github.com/TheWildJames/GKI_KernelSU_SUSFS.git
          find GKI_KernelSU_SUSFS -name "susfs.h" -exec cp {} include/linux/ \;
          find GKI_KernelSU_SUSFS -name "susfs.c" -exec cp {} fs/ \;
          # Aplicamos o patch do SUSFS para esconder o root, mas sem o spoofing de modelo
          if [ -f GKI_KernelSU_SUSFS/hide.patch ]; then
            patch -p1 --batch --silent < GKI_KernelSU_SUSFS/hide.patch || echo "Patch ignorado."
          fi

      - name: Configurar Defconfig (Puro)
        run: |
          DEFCONFIG=$(find kernel -name "gki_defconfig" -print -quit)
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_NEXT=y"
            echo "CONFIG_SUSFS=y"
            echo "CONFIG_KSU_SUSFS=y"
            # REMOVIDO: CONFIG_KSU_SUSFS_SPOOF_SAMSUNG
          } >> $DEFCONFIG

      - name: Build Kernel
        run: |
          # Ajuste para a versão exata que você precisa (6.6.98 ou similar)
          MAKEFILE=$(find kernel -name "Makefile" -type f -exec grep -l "SUBLEVEL =" {} + | head -n 1)
          sed -i 's/^VERSION =.*/VERSION = 6/' $MAKEFILE
          sed -i 's/^PATCHLEVEL =.*/PATCHLEVEL = 6/' $MAKEFILE
          sed -i 's/^SUBLEVEL =.*/SUBLEVEL = 87/' $MAKEFILE # Versão que vimos no seu log!
          
          find kernel -name "build.config.gki" -exec sed -i 's/check_defconfig//' {} +
          
          cd kernel
          ./tools/bazel build --config=fast //common:kernel_aarch64_dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Moto-Puro
          path: kernel/bazel-bin/common/kernel_aarch64/Image
