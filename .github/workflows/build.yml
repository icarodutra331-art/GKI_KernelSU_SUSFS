name: Build GKI S24U Professional
on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android Version"
        required: true
        default: "android15"
      kernel_version:
        description: "Kernel Version"
        required: true
        default: "6.6"
      os_patch_level:
        description: "OS Patch Level (ex: 2024-11)"
        required: true
        default: "2024-11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lld llvm clang git python3 curl wget
          mkdir -p bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > bin/repo
          chmod a+rx bin/repo
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Sync Kernel Source
        run: |
          mkdir kernel && cd kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}
          repo sync -j$(nproc --all)

      - name: Integrate KernelSU Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Integrate SUSFS & Hide Patch
        run: |
          cd kernel/common
          # Baixando os arquivos necessários do SUSFS
          curl -LSs "https://raw.githubusercontent.com/namelessghost/susfs4ksu/main/include/linux/susfs.h" -o include/linux/susfs.h
          curl -LSs "https://raw.githubusercontent.com/namelessghost/susfs4ksu/main/fs/susfs.c" -o fs/susfs.c
          
          # Baixando o hide.patch que você mostrou nas fotos
          wget https://raw.githubusercontent.com/TheWildJames/GKI_KernelSU_SUSFS/main/hide.patch
          
          # Aplicando os patches (usando || true para não quebrar se houver aviso de offset)
          patch -p1 < hide.patch || echo "Patch aplicado com avisos"

      - name: Configure KSU & SUSFS Flags
        run: |
          cd kernel/common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          # Ativa a funcionalidade das suas imagens (SUS_MAP)
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG

      - name: Build Kernel
        run: |
          cd kernel
          # Remove a checagem de defconfig para evitar erros de compilação por modificação
          sed -i 's/check_defconfig//' common/build.config.gki
          tools/bazel build --config=fast //common:kernel_aarch64_dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_S24U_SUSFS
          path: kernel/bazel-bin/common/kernel_aarch64/Image
