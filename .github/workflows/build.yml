name: Build GKI Moto Stealth Ultra
permissions:
  contents: write
  actions: write 

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android Version"
        required: true
        default: "android16"
      kernel_version:
        description: "Kernel Version"
        required: true
        default: "6.6"
      os_patch_level:
        description: "OS Patch Level (Casado com seu sistema)"
        required: true
        default: "2026-02" # ATUALIZADO para Fevereiro de 2026

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lld llvm clang git python3 curl wget
          mkdir -p bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > bin/repo
          chmod a+rx bin/repo
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Sync Kernel Source
        run: |
          mkdir kernel && cd kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}
          repo sync -c -j$(nproc --all) --no-tags --fail-fast

      - name: Integração Stealth (KSU Next + Maphide)
        run: |
          COMMON_DIR=$(find kernel -name "drivers" -type d -print -quit | sed 's/\/drivers//')
          cd $COMMON_DIR
          git clone https://github.com/rifsxd/KernelSU-Next.git
          cp -r KernelSU-Next/kernel drivers/kernelsu
          
          # Patch para esconder o KernelSU de varreduras de memória (Maphide)
          sed -i 's/obj-y += kernelsu\//obj-y += kernelsu\/\nEXTRA_CFLAGS += -DCONFIG_KSU_MAPHIDE/' drivers/Makefile
          
          echo "obj-y += kernelsu/" >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Integrate WireGuard (VPN Nativa Ultra Rápida)
        run: |
          COMMON_DIR=$(find kernel -name "drivers" -type d -print -quit | sed 's/\/drivers//')
          cd $COMMON_DIR
          git clone https://github.com/WireGuard/wireguard-linux-compat.git
          ./wireguard-linux-compat/src/add-to-kernel.sh .
          echo "CONFIG_WIREGUARD=y" >> arch/arm64/configs/gki_defconfig

      - name: Integrate SUSFS
        run: |
          COMMON_DIR=$(find kernel -name "drivers" -type d -print -quit | sed 's/\/drivers//')
          cd $COMMON_DIR
          git clone https://github.com/TheWildJames/GKI_KernelSU_SUSFS.git
          find GKI_KernelSU_SUSFS -name "susfs.h" -exec cp {} include/linux/ \;
          find GKI_KernelSU_SUSFS -name "susfs.c" -exec cp {} fs/ \;
          if [ -f GKI_KernelSU_SUSFS/hide.patch ]; then
            patch -p1 --batch --silent < GKI_KernelSU_SUSFS/hide.patch || echo "Patch ignorado."
          fi

      - name: Configurar Defconfig (Turbo + Stealth)
        run: |
          DEFCONFIG=$(find kernel -name "gki_defconfig" -print -quit)
          {
            # Root e Camuflagem Avançada
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_NEXT=y"
            echo "CONFIG_SUSFS=y"
            echo "CONFIG_KSU_SUSFS=y"
            
            # Networking (Internet BBR + WireGuard)
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\""
            echo "CONFIG_WIREGUARD=y"
            
            # Otimização de Performance
            echo "CONFIG_LTO_CLANG_THIN=y" # Deixa o kernel mais rápido e otimizado
            
            # Matar rastros de Root para Duvk
            echo "# CONFIG_IKCONFIG_PROC is not set"
            echo "# CONFIG_KALLSYMS_ALL is not set"
            echo "# CONFIG_DEBUG_FS is not set" # Desativar Debug FS mata 90% dos detectores
          } >> $DEFCONFIG

      - name: Build Kernel (Versão Moto 6.6.87)
        run: |
          MAKEFILE=$(find kernel -name "Makefile" -type f -exec grep -l "SUBLEVEL =" {} + | head -n 1)
          sed -i 's/^VERSION =.*/VERSION = 6/' $MAKEFILE
          sed -i 's/^PATCHLEVEL =.*/PATCHLEVEL = 6/' $MAKEFILE
          sed -i 's/^SUBLEVEL =.*/SUBLEVEL = 87/' $MAKEFILE
          
          find kernel -name "build.config.gki" -exec sed -i 's/check_defconfig//' {} +
          
          cd kernel
          ./tools/bazel build --config=fast //common:kernel_aarch64_dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Moto-Ultra-Stealth
          path: kernel/bazel-bin/common/kernel_aarch64/Image
