name: Build GKI S24 Ultra Spoof 6.6.98
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lld llvm clang git python3 curl wget
          mkdir -p bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > bin/repo
          chmod a+rx bin/repo
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Sync Kernel Source
        run: |
          mkdir kernel && cd kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6
          repo sync -j$(nproc --all)

      - name: Integrate KernelSU Next (Manual)
        run: |
          cd kernel/common
          git clone https://github.com/rifsxd/KernelSU-Next.git
          cp -r KernelSU-Next/kernel drivers/kernelsu
          echo "obj-y += kernelsu/" >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Integrate SUSFS (Lógica do download.sh)
        run: |
          cd kernel/common
          # 1. Puxa os arquivos do SUSFS direto do repo do TheWildJames (como ele faz no script)
          mkdir -p include/linux fs
          wget https://raw.githubusercontent.com/TheWildJames/GKI_KernelSU_SUSFS/main/susfs4ksu/include/linux/susfs.h -O include/linux/susfs.h
          wget https://raw.githubusercontent.com/TheWildJames/GKI_KernelSU_SUSFS/main/susfs4ksu/fs/susfs.c -O fs/susfs.c
          
          # 2. Puxa e aplica o hide.patch que está na raiz
          wget https://raw.githubusercontent.com/TheWildJames/GKI_KernelSU_SUSFS/main/hide.patch
          patch -p1 < hide.patch || echo "Aviso: Patch aplicado com offsets"

      - name: Configure S24 Ultra Spoof & Flags
        run: |
          cd kernel/common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          # Flags KSU e SUSFS
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_NEXT=y" >> $DEFCONFIG
          echo "CONFIG_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          
          # Injeção Direta S24 Ultra (Spoof)
          echo 'CONFIG_KSU_SUSFS_SPOOF_SAMSUNG=y' >> $DEFCONFIG
          echo 'CONFIG_KSU_SUSFS_ENABLE_SPOOF_SAMSUNG=y' >> $DEFCONFIG
          echo 'CONFIG_KSU_SUSFS_SPOOF_MODEL="SM-S928B"' >> $DEFCONFIG
          echo 'CONFIG_KSU_SUSFS_SPOOF_PRODUCT="e3q"' >> $DEFCONFIG
          echo 'CONFIG_KSU_SUSFS_SPOOF_MANUFACTURER="samsung"' >> $DEFCONFIG
          echo 'CONFIG_KSU_SUSFS_SPOOF_DEVICE="e3q"' >> $DEFCONFIG
          echo 'CONFIG_KSU_SUSFS_SPOOF_BOARD="e3q"' >> $DEFCONFIG
          
          # Ocultação
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG

      - name: Build Kernel (Force 6.6.98)
        run: |
          cd kernel
          sed -i 's/^VERSION =.*/VERSION = 6/' common/Makefile
          sed -i 's/^PATCHLEVEL =.*/PATCHLEVEL = 6/' common/Makefile
          sed -i 's/^SUBLEVEL =.*/SUBLEVEL = 98/' common/Makefile
          sed -i 's/check_defconfig//' common/build.config.gki
          tools/bazel build --config=fast //common:kernel_aarch64_dist

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-S24U-Spoof-6.6.98
          path: kernel/out/android15-6.6/dist/Image
