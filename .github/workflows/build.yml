name: Build GKI S24U Spoof Final
permissions:
  contents: write
  actions: write 

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Versão do Android"
        required: true
        default: "android15"
      kernel_version:
        description: "Versão do Kernel"
        required: true
        default: "6.6"
      os_patch_level:
        description: "Patch Level (ex: 2024-11)"
        required: true
        default: "2024-11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lld llvm clang git python3 curl wget
          mkdir -p bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > bin/repo
          chmod a+rx bin/repo
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Sync Kernel Source
        run: |
          mkdir kernel && cd kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}
          repo sync -c -j$(nproc --all) --no-tags --fail-fast

      - name: Integrate KernelSU Next (Sem Erro 404)
        run: |
          cd kernel/common
          # Em vez de curl (que gera o erro 404 da sua print), clonamos o repo
          git clone https://github.com/rifsxd/KernelSU-Next.git
          cd KernelSU-Next
          # Executa o setup localmente
          ./kernel/setup.sh main-next
          echo "KernelSU Next integrado com sucesso."

      - name: Integrate SUSFS & Patch (Correção Caminho Inexistente)
        run: |
          cd kernel/common
          git clone https://github.com/TheWildJames/GKI_KernelSU_SUSFS.git
          
          # Resolve o erro "No such file" da sua print
          # Usamos 'find' para localizar os arquivos onde quer que o James os tenha colocado
          find GKI_KernelSU_SUSFS -name "susfs.h" -exec cp {} include/linux/ \;
          find GKI_KernelSU_SUSFS -name "susfs.c" -exec cp {} fs/ \;
          
          # Aplica o hide.patch que está na raiz do repo
          if [ -f GKI_KernelSU_SUSFS/hide.patch ]; then
            cp GKI_KernelSU_SUSFS/hide.patch .
            patch -p1 < hide.patch || echo "Patch aplicado com sucesso."
          fi

      - name: Configure S24 Ultra Spoof (SM-S928B)
        run: |
          cd kernel/common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_NEXT=y"
            echo "CONFIG_SUSFS=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_SAMSUNG=y"
            echo 'CONFIG_KSU_SUSFS_SPOOF_MODEL="SM-S928B"'
            echo 'CONFIG_KSU_SUSFS_SPOOF_PRODUCT="e3q"'
            echo 'CONFIG_KSU_SUSFS_SPOOF_MANUFACTURER="samsung"'
            echo 'CONFIG_KSU_SUSFS_SPOOF_DEVICE="e3q"'
          } >> $DEFCONFIG

      - name: Force Kernel 6.6.98 & Build
        run: |
          cd kernel/common
          # Trava a versão conforme solicitado
          sed -i 's/^VERSION =.*/VERSION = 6/' Makefile
